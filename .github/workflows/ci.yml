name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: |
          if npm run lint --if-present 2>&1 | grep -q "missing script"; then
            echo "No lint script, skipping"
          else
            npm run lint
          fi
      - name: Typecheck
        run: |
          if npm run typecheck --if-present 2>&1 | grep -q "missing script"; then
            if npm run check --if-present 2>&1 | grep -q "missing script"; then
              echo "Running tsc --noEmit --skipLibCheck"
              npx tsc --noEmit --skipLibCheck
            else
              npm run check
            fi
          else
            npm run typecheck
          fi
      - name: Test
        run: |
          if npm run test --if-present 2>&1 | grep -q "missing script"; then
            echo "No test script, skipping"
          else
            npm test
          fi