name: Stale Bot

on:
  schedule:
    - cron: "0 1 * * *"  # Daily at 1 AM UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: "This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs. Thank you for your contributions."
          stale-pr-message: "This PR has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs."
          close-issue-message: "This issue was closed because it was stale for 30 days with no activity. Feel free to reopen if the problem still exists."
          close-pr-message: "This PR was closed because it was stale for 30 days with no activity. Feel free to reopen if you'd like to continue working on this."
          days-before-stale: 30
          days-before-close: 7
          operations-per-run: 30
          exempt-all-milestones: true
          exempt-all-assignees: true
          exempt-all-labels: true
          exempt-issue-labels: "pinned,security,bug"
          exempt-pr-labels: "pinned,dependencies,automated"
